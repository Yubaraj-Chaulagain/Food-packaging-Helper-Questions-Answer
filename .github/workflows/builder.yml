
name: Build Interview APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK Manager
        shell: bash
        run: |
          echo "Searching Android SDK Manager..."

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "SDK Manager found: $SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Accept Android SDK Licenses
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses || true

      - name: Install Android SDK Packages
        shell: bash
        run: |
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify Android SDK
        shell: bash
        run: |
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          export PATH="$ANDROID_HOME/platform-tools:$PATH"

          echo "Checking ADB..."
          "$ANDROID_HOME/platform-tools/adb" version

          echo "Checking Android platforms..."
          ls "$ANDROID_HOME/platforms"

          echo "Checking Android build tools..."
          ls "$ANDROID_HOME/build-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Java and Gradle
        run: |
          java -version
          gradle --version

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK file not found"
            exit 1
          fi

          ls -lh "$APK"

      - name: Rename APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk \
            output/Food-Packaging-Interview.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Food-Packaging-Interview-APK
          path: output/Food-Packaging-Interview.apk
          if-no-files-found: error
